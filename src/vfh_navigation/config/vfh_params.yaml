# Shared local control for both vfh and vfh_astar. Distances in metres, angles in radians.
vfh_node:
  ros__parameters:
    use_sim_time: true
    navigation_mode: vfh
    # Legacy standalone goal; scenario launches supply their own explicit goal/frame.
    goal_frame: odom
    goal_x: 10.0
    goal_y: 0.0
    goal_tolerance: 0.20
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    # Encloses chassis AND wheels. LiDAR mounting geometry comes from TF.
    robot_radius: 0.33
    safety_margin: 0.10
    influence_distance: 1.50
    stop_distance: 0.45
    sector_width_deg: 5.0
    observed_fraction: 0.80
    # Occupied-only odom-frame memory protects clearance as hits leave the 120-degree FOV.
    # This never makes an unobserved sector clear and is shared by both modes.
    obstacle_memory_seconds: 5.0
    obstacle_memory_resolution: 0.05
    histogram_threshold: 0.15
    max_linear_speed: 0.20
    max_angular_speed: 0.60
    # Exceeds heading_weight + smoothness_weight to avoid flat steering costs.
    goal_weight: 3.0
    heading_weight: 1.0
    smoothness_weight: 1.0
    switch_hysteresis: 0.35
    turn_side_penalty: 1.2
    angular_kp: 0.8
    angular_kd: 0.25
    angular_accel_limit: 0.8
    sensor_timeout: 0.5
    # Only known free occupancy values 0..25 are traversable.
    free_threshold: 25
    lookahead_distance: 0.60
    route_deviation: 0.50
    progress_window: 5.0
    minimum_progress: 0.15
    replan_interval: 1.0
    max_stuck_replans: 3
